<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeMirror · WebSharper</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" type="text/css" href="css/index.css" />
  <script type="text/javascript" src="Scripts/CodeMirror.head.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-brand">
        <span class="app-logo"><i class="fa-solid fa-i-cursor"></i></span>
        <div class="app-titles">
          <h1>CodeMirror</h1>
          <p>A code editor with <a href="https://websharper.com" target="_blank" rel="noreferrer">WebSharper</a></p>
        </div>
      </div>
      <a class="btn btn-ghost" href="https://github.com/websharper-samples/CodeMirror" target="_blank" rel="noreferrer">
        <i class="fa-brands fa-github"></i><span>Source</span>
      </a>
    </header>

    <main class="content">
      <section class="card">
        <div class="card-head">
          <div>
            <h2>CodeMirror 6</h2>
            <p>A full-featured editor, configured from F#.</p>
          </div>
        </div>
        <div class="card-body">
          <div class="toolbar">
            <div class="lang-bar" ws-hole="Languages"></div>
            <button class="btn btn-ghost btn-small" ws-onclick="ToggleTheme" ws-hole="Theme"></button>
          </div>
          <div class="editor-wrap" ws-hole="Editor"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="Scripts/CodeMirror.min.js"></script>
</body>
</html>
